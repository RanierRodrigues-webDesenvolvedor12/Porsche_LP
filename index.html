<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porsche Premium Preloader</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Container do Preloader -->
    <div id="preloader">
        <div class="brand-container">
            <!-- Substitua o src pelo caminho do brasão (escudo) recortado da sua imagem -->
            <img src="Assets/Logo.svg" alt="Porsche Crest" class="porsche-crest">
            
            <div class="porsche-text">
              <h2 class="pre-black" id="text-pre">POR<span class="pre-red">SCHE</span></h2>
            </div>
        </div>
    </div>

    <main class="main-content">
        
        <!-- Header -->
        <header class="site-header">
            <div class="logo-area">
                <img src="Assets/Logo.svg" alt="Porsche Logo" class="header-crest">
                <span class="header-brand">POR<span class="text-red">SCHE</span></span>
            </div>
            <nav class="nav-area">
                <a href="#" class="nav-link">Conheça nossos carros</a>
                <a href="#" class="btn-primary">Entre em contato</a>
            </nav>
        </header>

        <!-- Hero Section -->
        <section class="hero">
            <!-- Fundo futurista -->
            <div class="hero-bg"></div> 
            
            <!-- Faixas vermelhas animadas -->
            <div class="stripes-wrapper">
                <div class="stripe left-stripe"></div>
                <div class="stripe right-stripe"></div>
            </div>

            <!-- Container do Carro -->
            <div class="car-wrapper">
                <!-- Substitua pelo PNG do carro recortado (visto de cima) -->
                <img src="Assets/Porsche_Hero.webp" alt="Porsche 911" class="hero-car">
            </div>

            <!-- Conteúdo de Texto -->
            <div class="hero-content">
                <div class="text-box">
                    <h1 class="hero-title">O luxo em sua<br>forma mais<br>veloz</h1>
                    <p class="hero-desc">Mais do que um carro, um símbolo de status, inovação e personalidade. Entre no universo Porsche e sinta o prazer de dirigir algo extraordinário.</p>
                    <a href="#" class="btn-secondary">
                        Explorar modelos 
                        <img src="Assets/Logo.svg" alt="Ícone" class="btn-icon">
                    </a>
                </div>
            </div>
        </section>

    <!-- Importação do GSAP -->
   <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
<!-- ScrollSmoother requires ScrollTrigger -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollSmoother.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/SplitText.min.js"></script>

    <script src="script.js"></script>
</body>
</html>
