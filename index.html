<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porsche Premium Preloader</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Container do Preloader -->
    <div id="preloader">
        <div class="brand-container">
            <!-- Substitua o src pelo caminho do brasão (escudo) recortado da sua imagem -->
            <img src="Assets/Logo.svg" alt="Porsche Crest" class="porsche-crest">
            
            <div class="porsche-text">
              <h2 class="pre-black" id="text-pre">POR<span class="pre-red">SCHE</span></h2>
            </div>
        </div>
    </div>

    <!-- Conteúdo Principal da sua página -->
    <main class="main-content">
        <h1>O conteúdo do seu site começa aqui.</h1>
    </main>

    <!-- Importação do GSAP -->
   <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
<!-- ScrollSmoother requires ScrollTrigger -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollSmoother.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/SplitText.min.js"></script>

    <script src="script.js"></script>
</body>
</html>
